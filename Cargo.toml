[package]
name = "ascii-fields"
version = "0.1.0"
edition = "2021"
authors = ["akerlund <fredrik.akerlund.lh@gmail.com>"]
description = "Procedural ASCII animations for the terminal"
license = "MIT"

[[bin]]
name = "ascii-fields"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
cpu-time = "1"
crossterm = "0.27"
font8x8 = "=0.3.1"
gif = "=0.12.0"
rand = "0.8"
rand_pcg = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "animations"
harness = false
